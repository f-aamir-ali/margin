[package]
name = "margin"
version = "0.3.0"
description = "A Windows notepad with live Markdown and draft recovery"
authors = ["F. Aamir Ali"]
license = "MIT"
repository = "https://github.com/f-aamir-ali/margin"
edition = "2024"

[lib]
name = "margin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
notify = "8"
notify-debouncer-full = "0.7"
natord = "1"
tempfile = "3"
encoding_rs = "0.8"
chardetng = "0.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
